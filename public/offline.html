<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6d28d9" />
    <title>Reconnect · Opulence Bliss</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #f7f8f9;
        color: #16202a;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(420px, 100%);
        padding: 32px;
        border-radius: 24px;
        background: white;
        border: 1px solid #e4e7eb;
      }
      .brand {
        font-weight: 900;
        font-size: 23px;
        letter-spacing: -1px;
      }
      .brand span {
        color: #6d28d9;
      }
      h1 {
        margin: 30px 0 12px;
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        color: #6b7280;
        line-height: 1.6;
      }
      button {
        margin-top: 14px;
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #6d28d9;
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">opulence<span>bliss</span></div>
      <h1>Let’s get you connected.</h1>
      <p>Check your Wi-Fi or mobile data, then try again.</p>
      <p>
        Bookings, payments and changes need an internet connection. Nothing on
        this screen confirms a booking or payment.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
