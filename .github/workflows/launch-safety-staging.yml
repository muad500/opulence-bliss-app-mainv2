name: Launch safety checks (isolated database)
on:
  pull_request:
    branches: [codex/staging]
    paths:
      [
        "supabase/migrations/20261024*",
        "supabase/migrations/20261025*",
        "supabase/tests/launch_safety.sql",
        "lib/cleaning*",
        "lib/visit*",
        "app/api/admin/dbs*/**",
        ".github/workflows/launch-safety-staging.yml",
      ]
permissions: { contents: read }
jobs:
  application-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://comwdjprdedmsnxtvuuk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          HANDYMAN_MARKETPLACE_ENABLED: "false"
  isolated-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          {
            POSTGRES_DB: launch_safety_test,
            POSTGRES_PASSWORD: isolated-ci-only,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/launch_safety.sql
        env:
          {
            PGHOST: localhost,
            PGDATABASE: launch_safety_test,
            PGUSER: postgres,
            PGPASSWORD: isolated-ci-only,
          }
