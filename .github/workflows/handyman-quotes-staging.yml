name: Handyman quote-only staging checks
on:
  pull_request:
    branches: [codex/staging]
    paths:
      - "app/handyman/**"
      - "app/api/handyman/**"
      - "lib/handyman*"
      - "components/Handyman*"
      - "components/admin/Handyman*"
      - "supabase/migrations/*handyman_quote*"
      - "supabase/tests/0024_handyman_quote_marketplace.sql"
      - "scripts/test-handyman-quote-marketplace.mjs"
      - "scripts/test-handyman-quote-concurrency.mjs"
      - ".github/workflows/handyman-quotes-staging.yml"
permissions:
  contents: read
jobs:
  isolated-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quote_contract_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run quote lifecycle and money-state database tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/0024_handyman_quote_marketplace.sql
        env:
          PGHOST: localhost
          PGDATABASE: quote_contract_test
          PGUSER: postgres
          PGPASSWORD: isolated-ci-only
      - name: Race two independent quote acceptances
        run: node scripts/test-handyman-quote-concurrency.mjs
        env:
          PGHOST: localhost
          PGDATABASE: quote_contract_test
          PGUSER: postgres
          PGPASSWORD: isolated-ci-only
  stripe-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Test real payment implementation against isolated Stripe fixtures
        run: node --test scripts/test-handyman-quote-marketplace.mjs
      - run: npx tsc --noEmit
