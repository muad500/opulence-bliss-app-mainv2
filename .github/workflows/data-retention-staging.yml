name: Data retention database checks
on:
  pull_request:
    branches: [codex/staging, main]
    paths: ["**/*[Rr]etention*", ".github/workflows/data-retention-staging.yml"]
permissions:
  contents: read
jobs:
  isolated-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test retention periods, legal holds, file recovery and business deletion
        run: |
          task_test_dir="$(mktemp -d)"
          npm install --prefix "$task_test_dir" --no-audit --no-fund --ignore-scripts --save-exact @electric-sql/pglite@0.5.11
          RETENTION_PGLITE_MODULE="$task_test_dir/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-data-retention-database.mjs
