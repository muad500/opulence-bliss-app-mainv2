name: Web Push staging checks
on:
  pull_request:
    branches: [codex/staging]
    paths: ['**/*[Pp]ush*', 'supabase/tests/web_push.sql', 'public/app-worker.js', '.github/workflows/web-push-staging.yml']
permissions:
  contents: read
jobs:
  isolated-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: push_contracts, POSTGRES_PASSWORD: isolated-ci-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/web_push.sql
        env: { PGHOST: localhost, PGDATABASE: push_contracts, PGUSER: postgres, PGPASSWORD: isolated-ci-only }
