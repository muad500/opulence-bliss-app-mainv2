name: Checkout legal consent database checks
on:
  pull_request:
    branches: [codex/staging]
    paths: ['**/*[Ll]egal*', 'app/api/checkout/**', 'supabase/tests/checkout_legal.sql', '.github/workflows/checkout-legal-staging.yml']
permissions: { contents: read }
jobs:
  isolated-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: legal_contracts, POSTGRES_PASSWORD: isolated-ci-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/checkout_legal.sql
        env: { PGHOST: localhost, PGDATABASE: legal_contracts, PGUSER: postgres, PGPASSWORD: isolated-ci-only }
