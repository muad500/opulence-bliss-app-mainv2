name: Shared account foundation checks
on:
  pull_request:
    branches: [codex/staging]
permissions:
  contents: read
jobs:
  offline-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/stage1-db" --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Execute migrations and permission/notice failure cases offline
        run: PGLITE_MODULE="$RUNNER_TEMP/stage1-db/node_modules/@electric-sql/pglite" node scripts/test-shared-foundation-db.mjs
